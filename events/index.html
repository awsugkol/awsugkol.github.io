<head>

<body class="dark-theme">
  <script>
    (function () {
      const theme = localStorage.getItem('theme') || 'dark';
      if (theme === 'light') {
        document.body.classList.remove('dark-theme');
        document.body.classList.add('light-theme');
      }
    })();
  </script>
  <nav id="navbar" class="navbar"></nav>

  <main>
    <!-- Hero Section -->
    <section class="hero page-hero">
      <div class="hero-grid-overlay"></div>
      <div class="hero-content">
        <div class="hero-badge-pill animate-fade">
          <span class="pulse-dot"></span>
          Meetups & Workshops • 80+ Events Hosted
        </div>
        <h1 class="animate-up">Events & <span class="purple-text">Meetups</span></h1>
        <p class="animate-up delay-1">Explore our catalog of hosted meetups, technical sessions, and community gatherings.</p>
      </div>
    </section>

    <!-- Events Section -->
    <section id="events" class="events section" style="padding-top: 1rem;">
      <div class="container">
        <div class="events-search-container reveal">
          <div class="search-wrapper">
            <input type="text" id="events-search" placeholder="Search events by title..." autocomplete="off" />
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
        </div>
        <div class="events-grid" id="events-grid">
          <!-- Events will be dynamically injected here via JavaScript -->
        </div>
        <div id="events-pagination" class="pagination"></div>
      </div>
    </section>
  </main>

  <footer></footer>

  <script src="../assets/js/layout.js"></script>
</body>

</html>
